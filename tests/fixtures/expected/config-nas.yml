log-level: warning
mode: rule
mixed-port: 7897
tcp-concurrent: true
unified-delay: true
geo-auto-update: true
geo-update-interval: 168
geodata-mode: true
profile:
  store-selected: true
sniffer:
  enable: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 88, 8080] # Защищаем открытый веб-трафик и HTTP-анонсеры
      override-destination: true
    TLS:
      ports: [] # для протокола VLESS-REALITY на любых устройствах приходится отключить
    QUIC:
      ports: [] # для протокола VLESS-REALITY на любых устройствах
# --- НАСТРОЙКИ DNS ---
hosts:
  'ntc.party': 130.255.77.28
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 77.88.8.8
    - tls://223.5.5.5
    - tls://223.6.6.6
  # DoH/DoT вместо plain-UDP: защита от перехвата и подмены DNS на этом канале.
  # Мёртвые адреса нод резолвером не лечатся: лечится выбором ноды/health-check.
  proxy-server-nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - tls://223.5.5.5
    - tls://223.6.6.6
    - 77.88.8.8
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://doh.opendns.com/dns-query
    - https://dns.google/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    # '+.lan': 192.168.2.1 # cisco блокирует UDP
    # '+.local': 192.168.2.1
    '+.lan': tcp://192.168.2.1:53 # но TCP может пройти через cisco клиент
    '+.local': tcp://192.168.2.1:53
    '+.supercell.net': https://dns.google/dns-query
    '+.brawlstarsgame.com': https://dns.google/dns-query
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.connectivitycheck.gstatic.com
    - +.detectportal.firefox.com
    - +.pool.ntp.org
    - +.ntp.org
    - +.time.windows.com
    - +.3gppnetwork.org
# --- ДИНАМИЧЕСКИЙ ИСТОЧНИК ПРОКСИ ПРОВАЙДЕРА ---
proxy-providers:
  vpnd-io-ws:
    type: http
    url: "https://sub.example.invalid/PLACEHOLDER"
    path: ./providers/vpnd-io-ws.yaml
    interval: 3600
    format: share
    override:
      additional-prefix: "WS | "
      ip-version: ipv4 # IPv6-адреса нод провайдера недостижимы, dial падает
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
  vpnd-io-vless:
    type: http
    url: "https://sub.example.invalid/PLACEHOLDER"
    path: ./providers/vpnd-io-vless.yaml
    interval: 3600
    format: share
    override:
      additional-prefix: "VLESS | "
      ip-version: ipv4
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
  golem-ai:
    type: inline
    payload:
      - name: unused
        type: direct
# Источники гео-баз рунета
geox-url:
  geosite: "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat"
  geoip: "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat"
rule-providers:
  hagezi_pro:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/zxc-rv/ad-filter/releases/latest/download/adlist.mrs
    path: ./adblock/adlist.mrs
    interval: 86400
  discord:
    type: inline
    behavior: classical
    format: text
    payload:
      - DOMAIN-REGEX,^(?=.*discord)(?!.*\.ru$).*$
      # - AND,((DOMAIN-KEYWORD,discord),(NOT,(DOMAIN-SUFFIX,ru)))
      - AND,((IP-CIDR,34.0.192.0/18,no-resolve),(NETWORK,UDP),(DST-PORT,50000-50100))
      - AND,((IP-CIDR,35.192.0.0/11,no-resolve),(NETWORK,UDP),(DST-PORT,50000-50100))
      - AND,((IP-CIDR,66.22.192.0/18,no-resolve),(NETWORK,UDP),(DST-PORT,50000-50100))
proxy-groups:
  - name: 'Запломбировано'
    type: select
    proxies: [REJECT, DIRECT]
    icon: "https://www.svgrepo.com/show/300290/sign-roadblock.svg"
  - name: 'Pinned Proxy'
    type: select
    use: [vpnd-io-vless, vpnd-io-ws]
    icon: "https://www.svgrepo.com/show/306500/openai.svg"
  - name: 'Развлечения и Контроль'
    type: select
    use: [vpnd-io-vless, vpnd-io-ws]
    proxies: [REJECT]
    icon: "https://www.svgrepo.com/show/130410/games-control.svg"
  - name: 'Normal Proxy'
    type: url-test
    use: [vpnd-io-vless, vpnd-io-ws]
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    tolerance: 150
    icon: "https://www.svgrepo.com/show/390797/360-rotate-vr-movement.svg"
  - name: 'Остальной трафик'
    type: select
    use: [vpnd-io-vless, vpnd-io-ws]
    proxies: [DIRECT]
    icon: "https://www.svgrepo.com/show/448084/other-income.svg"
  - name: GLOBAL
    type: select
    hidden: true
    proxies: ['Normal Proxy', DIRECT]
# --- ТОЧЕЧНЫЕ ПРАВИЛА МАРШРУТИЗАЦИИ (ЕДИНЫЕ ДЛЯ ВСЕХ) ---
rules:
  # Локальные исключения
  - GEOSITE,private,DIRECT
