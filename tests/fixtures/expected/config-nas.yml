  # Корпоративная подсеть Cisco всегда напрямик
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  # DNS-резолверы и служебные домены — всегда напрямик.
  # Иначе петля: DoH-домены из dns.nameserver уходят в прокси-группы (GEOSITE,cloudflare,
  # GEOSITE,google ниже), а ноды этих групп сами не резолвятся — DNS падает и тянет за
  # собой весь трафик. В логе: cloudflare-dns.com шёл через 'Normal Proxy' и падал на dial
  # к ноде, а dial к doh.opendns.com (146.112.41.2) и dns.google (8.8.4.4) отменялся.
  - DOMAIN-SUFFIX,cloudflare-dns.com,DIRECT
  - DOMAIN-SUFFIX,doh.opendns.com,DIRECT
  - DOMAIN-SUFFIX,dns.google,DIRECT
  - DOMAIN-SUFFIX,doh.pub,DIRECT
