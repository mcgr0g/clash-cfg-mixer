name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      # mise сам вычислит UID раннера на CI, возьмет версию yq и прогонит тесты на порту 2026
      - name: Run Integration Tests via mise
        run: mise run test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Версии базовых образов заданы литералами в Dockerfile (FROM),
      # чтобы Dependabot мог предлагать обновления.
      - name: Build and Push Production Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Пуш attestation-манифестов (provenance/SBOM) падает на новых раннерах
          # с containerd image store: "ERROR: unknown blob" при пуше в GHCR.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ github.run_number }}